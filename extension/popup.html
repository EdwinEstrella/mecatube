<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mecatube Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="header">
      <img src="icons/icon-48.png" alt="Mecatube Bridge icon" class="logo" width="40" height="40">
      <div class="header-text">
        <div class="title-row">
          <h1 class="title">Mecatube Bridge</h1>
          <span id="version" class="version-badge"></span>
        </div>
        <p class="description">Conecta la app Mecatube con DeepSeek y Google Flow.</p>
      </div>
    </header>

    <div class="actions">
      <button id="donate-btn" type="button" class="btn-donate">❤ Donar a Mecatube</button>
      <p class="caption">Tu apoyo mantiene el proyecto gratis.</p>
      <button id="github-link" type="button" class="link-github">Ver el proyecto en GitHub</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
